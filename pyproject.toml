[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "similarfaces"
dynamic =["version"]
description = "A production-ready Face Recognition library powered by ONNX"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Narek", email = "narekbek1@gmail.com"}
]
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.1",
    "onnxruntime>=1.15.0",
    "scikit-image>=0.19.0",
    "scipy>=1.7.0",
    "Pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.64.0",
]

[tool.setuptools_scm]

[project.urls]
Homepage = "https://github.com/narek-bektashyan/similarfaces"

[tool.setuptools.packages.find]
where = ["."]
include = ["similarfaces*"]
